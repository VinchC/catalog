name: CI

on:
  push:
    branches: [dev, main]
    paths-ignore:
      - "**/*.md"

  pull_request:
    branches: [dev, main]
    paths-ignore:
      - "**/*.md"

jobs:
  validate:
    name: Tests et validation
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: catalog
          POSTGRES_PASSWORD: catalog_ci_password
          POSTGRES_DB: catalog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U catalog -d catalog_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://catalog:catalog_ci_password@localhost:5432/catalog_test?schema=public
      DIRECT_URL: postgresql://catalog:catalog_ci_password@localhost:5432/catalog_test?schema=public
      AUTH_SECRET: ci-only-secret-not-for-production
      NEXTAUTH_SECRET: ci-only-secret-not-for-production
      NEXTAUTH_URL: http://localhost:3000
      ADMIN_PASSWORD: ci-admin-password-not-for-production
      USER_PASSWORD: ci-user-password-not-for-production

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26.13.0
          cache: npm

      - name: Afficher les versions
        run: |
          node --version
          npm --version

      - name: Installer les dépendances
        run: npm ci

      - name: Générer le client Prisma
        run: npx prisma generate

      - name: Créer le fichier de configuration des tests d'intégration
        run: |
          printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > .env.test

      - name: Appliquer les migrations
        run: npx prisma migrate deploy

      - name: Vérifier le statut des migrations
        run: npx prisma migrate status

      - name: Importer les données du catalogue
        run: npx prisma db seed

      - name: Créer les comptes de test
        run: npx tsx prisma/create-users.ts

      - name: Vérifier les données du catalogue
        run: npm run validate:data

      - name: Vérifier le lint
        run: npm run lint

      - name: Exécuter les tests unitaires
        run: npm run test

      - name: Exécuter les tests d'intégration
        run: npm run test:integration

      - name: Vérifier les types TypeScript
        run: npx tsc --noEmit

      - name: Construire l'application
        run: npm run build

      - name: Installer Chromium pour Playwright
        run: npx playwright install --with-deps chromium

      - name: Exécuter les tests E2E
        run: npm run test:e2e

  migrate-production:
    name: Migrations de production
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production

    concurrency:
      group: production-database-migrations
      cancel-in-progress: false

    permissions:
      contents: read

    env:
      DIRECT_URL: ${{ secrets.DIRECT_URL }}

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26.13.0
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Appliquer les migrations de production
        run: npx prisma migrate deploy

      - name: Vérifier le statut des migrations
        run: npx prisma migrate status

  deploy-production:
    name: Déploiement Vercel Production
    needs: migrate-production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production

    permissions:
      contents: read

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26.13.0
          cache: npm

      - name: Déployer sur Vercel
        run: npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"
