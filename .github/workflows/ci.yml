name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  validate:
    name: Tests et validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: catalog
          POSTGRES_PASSWORD: catalog_ci_password
          POSTGRES_DB: catalog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U catalog -d catalog_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://catalog:catalog_ci_password@localhost:5432/catalog_test?schema=public
      AUTH_SECRET: ci-only-secret-not-for-production
      NEXTAUTH_SECRET: ci-only-secret-not-for-production
      NEXTAUTH_URL: http://localhost:3000
      ADMIN_PASSWORD: ci-admin-password-not-for-production
      USER_PASSWORD: ci-user-password-not-for-production

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Générer le client Prisma
        run: npx prisma generate

      - name: Créer le fichier de configuration des tests d'intégration
        run: |
          printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > .env.test

      - name: Appliquer les migrations
        run: npx prisma migrate deploy

      - name: Importer les données du catalogue
        run: npx tsx prisma/seed.ts

      - name: Créer les comptes de test
        run: npx tsx prisma/create-users.ts

      - name: Vérifier les données du catalogue
        run: npm run validate:data

      - name: Vérifier le lint
        run: npm run lint

      - name: Exécuter les tests unitaires
        run: npm run test

      - name: Exécuter les tests d'intégration
        run: npm run test:integration

      - name: Vérifier les types TypeScript
        run: npx tsc --noEmit

      - name: Construire l'application
        run: npm run build

      - name: Installer Chromium pour Playwright
        run: npx playwright install --with-deps chromium

      - name: Exécuter les tests E2E
        run: npm run test:e2e
